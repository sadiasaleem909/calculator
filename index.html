<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="card main rounded-5 pb-3 my-3" style="width: 18rem;">

        <div class="card-body d-flex flex-column p-2 gap-3">

            <div class="screen d-flex flex-column justify-content-center">
                <input type="text" class="input" id="value">
            </div>

            <div class="dailer d-flex flex-column  gap-3 ">
                <div>
                    <button id="clear" class="btns">C</button>
                </div>
                <div class="d-flex gap-4 align-item-center justify-content-center">
                    <button class="btns ">1</button>
                    <button class="btns">2</button>
                    <button class="btns">3</button>
                    <button class=" btns" id="divide">÷</button>
                </div>

                <div class="d-flex gap-4 align-item-center justify-content-center">
                    <button class="btns ">4</button>
                    <button class="btns">5</button>
                    <button class="btns">6</button>
                    <button class="opbtns btns ">×</button>
                </div>

                <div class="d-flex gap-4 align-item-center justify-content-center">
                    <button class="btns">7</button>
                    <button class="btns">8</button>
                    <button class="btns">9</button>
                    <button class="minus btns ">-</button>
                </div>

                <div class="d-flex gap-4 align-item-center justify-content-center">
                    <button class="btns">0</button>
                    <button class="dot btns">.</button>
                    <button class="equals ">=</button>
                    <button class="opbtns btns ">+</button>
                </div>
            </div>

        </div>

    </div>

    

<script src="app.js"></script>

</body>
</html>
